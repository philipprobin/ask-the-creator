services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Keys can be entered in the in-app setup wizard (persisted to ./data).
    # Or provide them here / via an env file instead:
    # environment:
    #   OPENAI_API_KEY: ${OPENAI_API_KEY}
    #   YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    #   SUPADATA_API_KEY: ${SUPADATA_API_KEY}
    # env_file: [.env.local]
    volumes:
      # Persist the SQLite DB + saved keys across restarts.
      - ./data:/app/data
    restart: unless-stopped

# For Postgres/pgvector instead of SQLite, set DATABASE_URL in the app's
# environment above and point it at your Postgres (e.g. Supabase/Neon).
